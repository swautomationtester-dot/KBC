<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>GamesArena • Mini Kart Race</title><link rel="stylesheet" href="/style.css?v=75"><link rel="stylesheet" href="/kart.css?v=1"><link rel="stylesheet" href="/common-ui.css?v=20260812-global-1">
</head><body class="kartPage"><main class="kartShell gaPageMain"><section id="lobby" class="kartCard"><div class="kartBrand">MINI KART <span>RACE</span></div><p>Use your phone as a steering wheel. Race on the big screen.</p><input id="name" maxlength="18" placeholder="Your name"><div class="kartRow"><button id="create">Create Race</button><button id="showJoin" class="dark">Join Race</button></div><div id="joinBox" class="hidden"><input id="room" inputmode="numeric" maxlength="4" placeholder="4-digit room code"><button id="join">Join Room</button></div><div id="msg"></div></section><section id="game" class="hidden"><header class="kartHeader"><div><b>🏁 MINI KART RACE</b><small id="roomLabel"></small></div><div id="raceStatus">Waiting…</div></header><div class="kartInfo"><div id="players"></div><div class="tvLink"><span>TV:</span> <a id="tvUrl" target="_blank"></a></div></div><div class="controller"><div class="joystick" id="stick"><div class="knob" id="knob"></div></div><button class="boost" id="boost">⚡<small>BOOST</small></button></div><div class="hint">Push the joystick to steer • Up = accelerate • Release to coast</div><button id="start" class="startBtn hidden">Start Race</button><button id="restart" class="startBtn hidden">New Race</button></section></main><script src="/socket.io/socket.io.js"></script><script src="/kart.js?v=1"></script><script src="/common-ui.js?v=20260812-global-1"></script>
