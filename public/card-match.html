<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Card Match</title><link rel="stylesheet" href="/style.css?v=65"><link rel="stylesheet" href="/card-match.css?v=8"></head>
<body class="cardMatchPage"><header class="sitebar"><a href="/" class="cmBrand"><img src="/assets/logo-dark.png" class="brand"> 🃏 <b>Card Match</b></a><span class="chip">MEMORY ARENA</span></header>
<main class="cmWrap">
<section id="home" class="cmScreen active"><div class="cmHero"><label>MULTIPLAYER MINI GAME</label><h1>Remember.<br><em>Match.</em><br>Win.</h1><p>2–4 players. The TV shows the board while everyone plays from their phone.</p><div class="cmHeroBtns"><button id="create" class="primary big">📺 Create TV Game</button><button id="join" class="cmSecondary big">📱 Join a Game</button></div></div></section>
<section id="lobby" class="cmScreen"><div class="cmPanel"><label>ROOM READY</label><div id="code" class="cmCode">----</div><p>Scan the QR code or enter the room code.</p><div id="qr" class="cmQr"></div><div id="url" class="cmUrl"></div><div id="players" class="cmPlayers"></div><button id="start" class="primary big wide">Start Match</button><button id="lobbyNew" class="cmSecondary wide">New Room</button></div></section>
<section id="joinPage" class="cmScreen"><div class="cmPanel"><label>JOIN GAME</label><h2>Enter the arena</h2><p id="joinHint" class="cmHint">Enter the code shown on the TV.</p><input id="name" maxlength="18" placeholder="Your name"><input id="room" maxlength="4" inputmode="numeric" placeholder="4-digit room code"><button id="joinNow" class="primary big wide">Join Game</button><button id="back" class="cmSecondary wide">Back</button><button id="newRoom" class="cmSecondary wide">📺 Create New TV Game</button></div></section>
<section id="game" class="cmScreen cmGame">
 <div class="cmGameTop"><div><label>MEMORY BATTLE</label><h2 id="turn">Waiting…</h2><div id="turnMeta" class="turnMeta"></div></div><div class="cmTvControls"><button id="refreshGame" class="cmControl">↻ Refresh Board</button><button id="restartGame" class="cmControl primarySmall">⟳ New Game</button></div></div>
 <div id="turnStrip" class="turnStrip"></div>
 <div id="scores" class="cmScores"></div>
 <div id="board" class="cmBoard"></div>
 <div class="cmFoot"><span id="status"></span><span id="roomLabel"></span></div>
</section>
<section id="winner" class="cmScreen"><div class="cmPanel"><div class="trophy">🏆</div><label>MATCH COMPLETE</label><h1 id="winnerText"></h1><div id="final"></div><button id="again" class="primary big wide">Play Again</button><button id="winnerRefresh" class="cmSecondary wide">Refresh Board</button></div></section>
<div id="toast"></div><footer class="gaFooter" style="max-width:1000px"><span>GamesArena</span><span>Teamwork • Strategy • Fun</span><span>Powered by Perficient</span></footer></main>
<script src="/socket.io/socket.io.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="/card-match.js?v=8"></script></body></html>
